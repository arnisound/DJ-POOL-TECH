<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="DJ Pool Tech — la boîte à outils du DJ : fiche technique, rider, analyse BPM et clef, roue Camelot, setlist, tap tempo.">
<title>DJ Pool Tech — La boîte à outils du DJ</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon-180.png">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/print.css" media="print">
</head>
<body>

<a class="skip-link" href="#main">Aller au contenu</a>

<div class="app" id="app">

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><circle cx="16" cy="16" r="4.2"/><path d="M16 3a13 13 0 0 1 11.3 6.6"/></svg>
      </span>
      <span class="brand-text">DJ&nbsp;Pool&nbsp;<b>Tech</b></span>
    </a>

    <div class="topbar-actions">
      <button class="icon-btn" id="theme-btn" aria-label="Changer de thème" title="Thème clair / sombre">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

  <nav class="sidebar" id="sidebar" aria-label="Navigation principale">
    <div class="sidebar-head">
      <span class="sidebar-title">Outils</span>
      <button class="icon-btn close-btn" id="sidebar-close" aria-label="Fermer le menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul class="nav-list" id="nav-list"></ul>
    <div class="sidebar-foot">
      <button class="btn btn-ghost btn-sm" id="backup-btn">Sauvegarde / Restauration</button>
      <p class="muted tiny">Vos données restent sur votre appareil.</p>
    </div>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <div class="view" id="view" aria-live="polite"></div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Accès rapide"></nav>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
<div class="modal-root" id="modal-root" hidden></div>
<div id="print-root" aria-hidden="true"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
